name: Release @worca/app to npm

# Tag-driven release. The git tag is the trigger AND the source of truth for
# the published version and dist-tag:
#
#   worca-app-v0.1.0        -> publishes 0.1.0 under the `latest` dist-tag
#   worca-app-v0.1.0-rc.1   -> publishes 0.1.0-rc.1 under the `rc` dist-tag
#
# The `worca-app-` prefix keeps this package's tags distinct from every other
# releasable in this repo (see docs/RELEASING.md).
on:
  push:
    tags:
      - "worca-app-v*"

permissions:
  contents: read

jobs:
  # A 4-way split of every tier: tools/test.mjs balances test/*.mjs by
  # test/timings.json, one runner each. A single runner took ~17 of a ~21-minute release.
  # Nothing publishes unless every shard passes on the tagged commit.
  test:
    name: npm test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No build step: plain Node ESM plus a vanilla HTML/CSS/JS frontend.
      - name: Run tests
        env:
          WORCA_TEST_SHARD: ${{ matrix.shard }}/4
        run: npm test

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    outputs:
      dist_tag: ${{ steps.dist-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1, which ships bundled
      # with Node >= 24.5. Rely on the bundled npm rather than
      # `npm install -g npm@latest` (that self-upgrade intermittently races and
      # fails with MODULE_NOT_FOUND 'promise-retry'). Fail loudly if the
      # bundled npm is ever too old.
      - name: Verify npm supports Trusted Publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm version: $NPM_VERSION"
          node -e 'const [a,b,c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error(`npm ${process.argv[1]} is < 11.5.1 (required for Trusted Publishing)`); process.exit(1); }' "$NPM_VERSION"

      - name: Validate tag matches package.json version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#worca-app-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Determine npm dist-tag
        id: dist-tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#worca-app-v}"
          if echo "$VERSION" | grep -q -- '-rc\.'; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Auth is via OIDC Trusted Publishing (no NPM_TOKEN in this repo).
      # Provenance is generated automatically under OIDC; --provenance makes
      # the requirement explicit so a misconfiguration fails the job instead of
      # silently publishing an unattested tarball.
      - name: Publish to npm
        run: npm publish --access public --provenance --tag ${{ steps.dist-tag.outputs.tag }}

  # The container image (docs/docker.md) ships from the same tag: built from
  # this checkout's `npm pack` output (the bytes npm just published), pushed to
  # GHCR with the tags docker-image.yml derives from the npm dist-tag, signed.
  image:
    needs: build-and-publish
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ github.ref_name }}
      channel: ${{ needs.build-and-publish.outputs.dist_tag }}

  release:
    needs: [build-and-publish, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#worca-app-v}"
          PRERELEASE=""
          if echo "$VERSION" | grep -q -- '-rc\.'; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            --title "@worca/app $VERSION" \
            --generate-notes \
            $PRERELEASE

  # Tells the worca platform (app.worca.dev) a release is out, so it can email the
  # release newsletter and offer the upgrade to hosted instances. Runs after the
  # GitHub Release exists. Best effort: a failed notification never fails the
  # release, but shows as a warning on the run. Skipped while the secret is unset.
  # See docs/RELEASING.md §8.
  notify-platform:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      WORCA_RELEASE_HOOK_SECRET: ${{ secrets.WORCA_RELEASE_HOOK_SECRET }}
      HOOK_URL: ${{ vars.WORCA_RELEASE_HOOK_URL || 'https://app.worca.dev/api/hooks/release' }}
    steps:
      - name: Skip (WORCA_RELEASE_HOOK_SECRET not set)
        if: env.WORCA_RELEASE_HOOK_SECRET == ''
        run: echo "::notice::WORCA_RELEASE_HOOK_SECRET is not set; not notifying the worca platform."

      - name: Build the signed release payload
        if: env.WORCA_RELEASE_HOOK_SECRET != ''
        id: payload
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#worca-app-v}"
          # The release was just created by the `release` job; fall back to the tag URL
          # and empty notes if it can't be read.
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json url,body > release.json; then
            URL="$(jq -r '.url // empty' release.json)"
          else
            echo "::warning::Could not read the GitHub release for $TAG_NAME; sending the tag URL and no notes."
            echo '{}' > release.json
            URL=""
          fi
          URL="${URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME}"
          # jq does all quoting: the notes are arbitrary text and never touch the shell.
          jq -cn --arg version "$VERSION" --arg url "$URL" --slurpfile rel release.json \
            '{version: $version, url: $url, notes: ($rel[0].body // "")}' > body.json
          # Sign the exact bytes curl will send (--data-binary @body.json).
          SIG="$(openssl dgst -sha256 -hmac "$WORCA_RELEASE_HOOK_SECRET" -r body.json | cut -d' ' -f1)"
          echo "signature=sha256=$SIG" >> "$GITHUB_OUTPUT"
          echo "Payload for $VERSION ($(wc -c < body.json) bytes): $(jq -c '{version, url, notes_chars: (.notes | length)}' body.json)"

      - name: Notify the worca platform
        if: env.WORCA_RELEASE_HOOK_SECRET != '' && steps.payload.outcome == 'success'
        continue-on-error: true
        env:
          SIGNATURE: ${{ steps.payload.outputs.signature }}
        run: |
          set -uo pipefail
          echo "POST $HOOK_URL"
          # --retry 2 = up to 3 attempts on transient failures (timeouts, 408/429/5xx).
          if curl -sS --fail-with-body --retry 2 --retry-delay 10 --retry-connrefused --max-time 30 \
               -X POST "$HOOK_URL" \
               -H "content-type: application/json" \
               -H "x-worca-signature: $SIGNATURE" \
               --data-binary @body.json; then
            echo
            echo "Platform notified."
          else
            rc=$?
            echo
            echo "::warning::Release hook to $HOOK_URL failed (curl exit $rc). The release itself is done; re-send by re-running this job."
            exit "$rc"
          fi
